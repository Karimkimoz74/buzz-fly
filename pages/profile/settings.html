<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - Buzz Fly</title>
  <link rel="stylesheet" href="/css/main.min.css" />
  <!-- edited by rawan — apply stored theme before first paint to avoid flash -->
  <script>
    (function () {
      var t = localStorage.getItem('buzzfly.theme');
      if (t) document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
</head>
<body class="bg-light pt-0">
  <div class="d-flex flex-column flex-lg-row min-vh-100">
    <div id="sidebar-slot"></div>

    <main class="flex-grow-1 px-3 px-lg-4 py-4" style="min-width:0;">

      <!-- Page Header -->
      <div class="d-flex align-items-start justify-content-between gap-3 mb-4">
        <div>
          <h1 class="fw-bold fs-4 mb-1">Settings</h1>
          <p class="text-muted small mb-0">Manage your preferences and flight experience.</p>
        </div>
        <a href="/pages/Notifications.html" class="buzz-icon-btn bg-light-green flex-shrink-0" aria-label="Notifications">
          <img src="/assets/icons/bell.svg" alt="" />
        </a>
      </div>

      <!-- edited by rawan — settings content -->
      <div style="max-width:560px;">

        <!-- ── Profile card ── -->
        <div class="card border rounded-4 p-3 mb-3">
          <div class="d-flex align-items-center gap-3">
            <img id="settings-avatar"
                 src="/assets/icons/user.svg"
                 alt="Your avatar"
                 class="rounded-circle object-fit-cover flex-shrink-0"
                 style="width:52px;height:52px;border:2px solid var(--bs-border-color);"
                 data-auth-avatar
                 data-default-src="/assets/icons/user.svg" />
            <span class="fw-semibold flex-grow-1 fs-6" id="settings-display-name">Traveler</span>
            <a href="/pages/profile/profile.html"
               class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0 text-muted text-decoration-none"
               title="Edit profile"
               style="width:36px;height:36px;background:var(--bs-secondary-bg,#EEF4EE);">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </a>
          </div>
        </div>

        <!-- ── Preferences card (Notifications + Dark mode) ── -->
        <div class="card border rounded-4 overflow-hidden mb-3">

          <!-- Notifications row -->
          <div class="d-flex align-items-center justify-content-between p-3">
            <div class="d-flex align-items-center gap-3">
              <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                    style="width:36px;height:36px;background:rgba(5,150,105,.12);">
                <img src="/assets/icons/bell.svg" alt="" width="16" height="16" />
              </span>
              <span class="fw-medium">Notifications</span>
            </div>
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" role="switch"
                     id="notification-switch" style="width:2.6rem;height:1.4rem;" checked />
              <label class="visually-hidden" for="notification-switch">Notifications</label>
            </div>
          </div>

          <hr class="my-0 mx-3 opacity-25">

          <!-- Dark mode row -->
          <div class="d-flex align-items-center justify-content-between p-3">
            <div class="d-flex align-items-center gap-3">
              <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                    style="width:36px;height:36px;background:rgba(79,0,208,.1);">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="color:#4F00D0;">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
              </span>
              <span class="fw-medium">Dark mode</span>
            </div>
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" role="switch"
                     id="dark-mode-switch" style="width:2.6rem;height:1.4rem;" />
              <label class="visually-hidden" for="dark-mode-switch">Dark mode</label>
            </div>
          </div>

        </div>

        <!-- ── Update Password ── -->
        <div class="card border rounded-4 overflow-hidden mb-3">
          <a href="/pages/auth/forgot-password.html"
             class="d-flex align-items-center justify-content-between p-3 text-decoration-none"
             style="color:inherit;">
            <div class="d-flex align-items-center gap-3">
              <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                    style="width:36px;height:36px;background:rgba(220,38,38,.1);">
                <img src="/assets/icons/lock.svg" alt="" width="16" height="16" />
              </span>
              <span class="fw-medium">Update Password</span>
            </div>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </a>
        </div>

        <!-- ── Delete Account ── -->
        <button type="button"
                id="delete-account-btn"
                class="btn w-100 rounded-4 py-3 fw-semibold mb-2"
                style="color:#DC2626;background:rgba(220,38,38,.08);border:1.5px solid rgba(220,38,38,.2);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
          Delete Account
        </button>

      </div>

      <!-- ── Delete Account confirmation modal (edited by rawan) ── -->
      <div class="modal fade" id="deleteModal" tabindex="-1"
           aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
          <div class="modal-content rounded-4 border-0 shadow-lg">
            <div class="modal-body p-4 text-center">
              <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                   style="width:52px;height:52px;background:rgba(220,38,38,.1);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                     stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                </svg>
              </div>
              <h5 class="fw-bold mb-2" id="deleteModalLabel">Delete Account?</h5>
              <p class="text-muted small mb-4">
                This will permanently remove your account and all your data.
                This cannot be undone.
              </p>
              <div class="d-flex gap-2">
                <button type="button"
                        class="btn btn-outline-secondary flex-grow-1 rounded-pill"
                        data-bs-dismiss="modal">Cancel</button>
                <button type="button"
                        id="confirm-delete-btn"
                        class="btn flex-grow-1 rounded-pill fw-semibold"
                        style="background:#DC2626;color:#fff;">Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="footer-slot" class="mt-4"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/settings.js"></script>
</body>
</html>
