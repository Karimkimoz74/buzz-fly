<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Perf: warm the TLS handshake to Firebase + Bootstrap origins during
       HTML parse, and start downloading the Firebase SDK in parallel. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js" crossorigin>

  <title>Trip Details - Buzz Fly</title>
  <link rel="stylesheet" href="/css/main.min.css" />
</head>
<body class="bg-light pt-0">
  <div class="d-flex flex-column flex-lg-row min-vh-100">
    <div id="sidebar-slot"></div>

    <main class="flex-grow-1 px-3 px-lg-4 py-3" style="min-width:0;">

      <!-- ===== Back link ===== -->
      <a href="/pages/profile/my-trips.html" class="text-decoration-none fw-semibold text-green small mb-3 d-inline-block">
        ← Back to My Trips
      </a>

      <!-- ===== Header ===== -->
      <div class="d-flex align-items-start gap-3 mb-4">
        <div class="rounded-4 d-inline-flex align-items-center justify-content-center flex-shrink-0" style="width:56px;height:56px;" data-trip-icon-wrap>
          <img src="/assets/icons/plane-takeoff.svg" alt="" width="26" height="26" data-trip-icon />
        </div>
        <div class="flex-fill" style="min-width:0;">
          <p class="text-uppercase fw-bold mb-1" style="font-size:.7rem;color:#a1a1aa;letter-spacing:.14em;">Trip Details</p>
          <h1 class="fw-bold fs-4 mb-0 text-break" data-trip-title>—</h1>
          <p class="text-secondary mb-0 small" data-trip-subtitle></p>
        </div>
      </div>

      <!-- ===== Segments card (hidden when no segments) ===== -->
      <section class="card border-0 shadow-sm rounded-4 mb-3 d-none" data-segments-card>
        <div class="card-body p-3 p-lg-4">
          <h2 class="h6 fw-bold mb-3">Itinerary</h2>
          <div class="d-flex flex-column gap-3" data-segments-list></div>
        </div>
      </section>

      <!-- ===== Traveller card (hidden when no traveller) ===== -->
      <section class="card border-0 shadow-sm rounded-4 mb-3 d-none" data-traveller-card>
        <div class="card-body p-3 p-lg-4">
          <h2 class="h6 fw-bold mb-3">Traveller</h2>
          <div class="d-flex flex-column gap-2" data-traveller-rows></div>
        </div>
      </section>

      <!-- ===== Booking summary card ===== -->
      <section class="card border-0 shadow-sm rounded-4 mb-3">
        <div class="card-body p-3 p-lg-4">
          <h2 class="h6 fw-bold mb-3">Booking Summary</h2>
          <div class="d-flex flex-column" data-summary-rows></div>
        </div>
      </section>

      <!-- ===== Footer (Cancel button OR cancelled/completed notice) ===== -->
      <section data-footer></section>

      <!-- ===== Loading placeholder (default state until JS hydrates) ===== -->
      <section class="d-none text-center py-5" data-loading-block>
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
      </section>

      <div class="pt-3" id="footer-slot"></div>
    </main>
  </div>

  <!-- ===== Cancel confirmation modal ===== -->
  <div class="modal fade" id="cancelBookingModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow-lg">
        <div class="modal-body p-4">
          <h2 class="h5 fw-bold mb-2">Cancel Booking</h2>
          <p class="text-secondary mb-4">Cancel this booking? This cannot be undone.</p>
          <p class="text-muted small mb-4 d-none" data-cancel-roundtrip-note>
            This is a round-trip booking — cancelling will cancel both the Departure and the Return.
          </p>
          <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">
            <button type="button" class="btn light-purple-btn px-4 py-2" data-bs-dismiss="modal">Keep Booking</button>
            <button type="button" class="btn text-danger bg-danger-subtle border-danger px-4 py-2 fw-semibold" data-cancel-confirm-btn>
              Cancel Booking
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script type="module" src="/js/pages/trip-detail.js"></script>
</body>
</html>
