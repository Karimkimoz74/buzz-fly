<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzz Fly | Hotel Results</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link href="../css/main.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/pages/hotels-results.css">
</head>
<body>

  <!-- Navbar partial -->
  <div id="navbar-slot"></div>

  <main class="container py-4">

    <p class="text-uppercase fw-bold small text-muted mb-3" style="letter-spacing: .18em; font-size: .72rem;">
      Destinations / Europe / <span class="text-green">Switzerland</span>
    </p>

    <!-- Hero -->
    <section class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end gap-4 mb-5">
      <div>
        <h1 class="display-3 fw-bold mb-3" style="letter-spacing: -0.04em;">Stays in Lake Lucerne</h1>
        <p class="lead text-muted mb-0" style="max-width: 620px;">
          Discover 124 curated properties blending alpine majesty with contemporary luxury.
        </p>
      </div>
      <div class="d-flex gap-2 flex-shrink-0">
        <button class="btn filter d-inline-flex align-items-center gap-2 px-4 py-2 bg-light fw-medium" type="button">
          <img src="../assets/icons/filter.svg" alt="" style="width: 16px; height: 16px;" />
          Filters
        </button>
        <button class="btn filter d-inline-flex align-items-center gap-2 px-4 py-2 bg-light fw-medium" type="button">
          <img src="../assets/icons/sort.svg" alt="" style="width: 16px; height: 16px;"/>
          Sort by: Popularity
        </button>
      </div>
    </section>

    <!-- Hotel cards grid -->
    <!--used js function -->

    <section id="cards-container" class="row g-4 mb-5"></section>
 

    <!-- Discover More -->
    <div class="d-flex justify-content-center pb-3">
      <a class="btn light-green-btn d-inline-flex align-items-center gap-3 px-4 py-3 fw-bold shadow-sm border" href="#">
        Discover More Properties
        <img src="../assets/icons/arrow-right.svg" alt="" style="width: 16px; height: 16px;" />
      </a>
    </div>

  </main>

  <!-- Footer partial -->
  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/pages/hotel-results.js" defer></script>
</body>
</html>
