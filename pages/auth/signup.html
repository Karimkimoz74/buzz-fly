<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzz Fly - Create Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/main.min.css" />
</head>
<body class="auth-body">

  <!--   MINIMAL TOP BAR (brand + sign in link)   -->
  <header class="d-flex justify-content-between  px-4 py-3">
    <a href="/index.html" class="text-decoration-none fw-bold fs-5 text-green">Buzz Fly</a>
    <a href="/pages/auth/signin.html" class="text-decoration-none fw-semibold text-green">Sign In</a>
  </header>

  <main class="container d-flex flex-column justify-content-center pb-5" style="max-width: 620px;">

    <!--   SIGN-UP CARD   -->
    <section class="card border-0 shadow-lg rounded-4 p-4 p-md-5 w-100 ">
      <form id="signupForm" novalidate>

        <!-- Card title -->
        <div class="text-center mb-4">
          <h1 class="fw-bold mb-2" style="letter-spacing: -0.02em;">Create Account</h1>
          <p class="text-muted mb-0">Start your ethereal travel journey today.</p>
        </div>

        <!-- Full Name -->
        <div class="mb-3">
          <label for="fullName" class="form-label small fw-bold text-uppercase text-muted mb-1" style="letter-spacing: .08em; font-size: .6875rem;">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0">
              <img src="/assets/icons/user.svg" alt="" style="width: 18px; height: 18px; opacity: .7;" />
            </span>
            <input type="text" id="fullName" name="fullName" class="form-control bg-light border-0" placeholder="Karim Mohamed" autocomplete="name" required />
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label small fw-bold text-uppercase text-muted mb-1" style="letter-spacing: .08em; font-size: .6875rem;">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0">
              <img src="/assets/icons/email.svg" alt="" style="width: 18px; height: 18px; opacity: .7;" />
            </span>
            <input type="email" id="email" name="email" class="form-control bg-light border-0" placeholder="kimoz@example.com" autocomplete="email" required />
          </div>
        </div>

        <!-- Password + Confirm (2-col on md+) -->
        <div class="row g-4 mb-3">
          <div class="col-12 col-md-6">
            <label for="password" class="form-label small fw-bold text-uppercase text-muted mb-1" style="letter-spacing: .08em; font-size: .6875rem;">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0">
                <img src="/assets/icons/lock.svg" alt="" style="width: 18px; height: 18px; opacity: .7;" />
              </span>
              <input type="password" id="password" name="password" class="form-control bg-light border-0" placeholder="••••••••" autocomplete="new-password" required />
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label for="confirmPassword" class="form-label small fw-bold text-uppercase text-muted mb-1" style="letter-spacing: .08em; font-size: .6875rem;">Confirm</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0">
                <img src="/assets/icons/re-enter-pass.svg" alt="" style="width: 18px; height: 18px; opacity: .7;" />
              </span>
              <input type="password" id="confirmPassword" name="confirmPassword" class="form-control bg-light border-0" placeholder="••••••••" autocomplete="new-password" required />
            </div>
          </div>
        </div>

        <!-- Terms checkbox -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="agreeTerms" name="agreeTerms" required />
          <label class="form-check-label small text-muted" for="agreeTerms">
            I agree to the
            <a href="/pages/term-of-services.html" class="text-green text-decoration-none fw-semibold">Terms of Service</a>
            and
            <a href="/pages/privacy-policy.html" class="text-green text-decoration-none fw-semibold">Privacy Policy.</a>
          </label>
        </div>

        <!-- Create Account button -->
        <button type="submit" class="btn green-btn w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
          Create Account
          <img src="/assets/icons/arrow-right.svg" alt="" style="width: 18px; height: 18px; filter: brightness(0) invert(1);" />
        </button>

        <!-- Divider -->
        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1 m-0" />
          <span class="mx-3 small text-uppercase text-muted" style="letter-spacing: .08em;">Or continue with</span>
          <hr class="flex-grow-1 m-0" />
        </div>

        <!-- Social buttons (compact icon-only, side-by-side) -->
        <div class="d-flex gap-4">
          <button type="button" class="btn flex-grow-1 d-flex align-items-center justify-content-center bg-white border py-2" data-auth-provider="google" aria-label="Sign up with Google">
            <img src="/assets/icons/google.svg" alt="" style="width: 22px; height: 22px;" />
          </button>
          <button type="button" class="btn flex-grow-1 d-flex align-items-center justify-content-center bg-white border py-2" data-auth-provider="apple" aria-label="Sign up with Apple">
            <img src="/assets/icons/apple.svg" alt="" style="width: 22px; height: 22px;" />
          </button>
        </div>

      </form>
    </section>

  </main>

  <!--   FOOTER   -->
  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/pages/auth.js" defer></script>
</body>
</html>
