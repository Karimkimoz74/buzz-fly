<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Perf: warm the TLS handshake to Firebase + Bootstrap origins during
       HTML parse, and start downloading the Firebase SDK in parallel so
       page scripts don't block waiting for the SDK to arrive. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://images.unsplash.com">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js" crossorigin>
  <title>Buzz Fly - Logout</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/main.min.css" />
</head>
<body class="auth-body">

  <header class="d-flex justify-content-between align-items-center px-4 py-3">
    <a href="/index.html" class="text-decoration-none fw-bold fs-5 text-green">Buzz Fly</a>
    <a href="/pages/auth/signin.html" class="text-decoration-none fw-semibold text-green small">Sign In</a>
  </header>

  <main class="container d-flex flex-column align-items-center justify-content-center pb-4 mx-auto" style="max-width:460px;">
    <header class="d-flex flex-column align-items-center text-center gap-2 mb-3">
      <div class="d-flex align-items-center justify-content-center rounded-circle bg-white shadow" style="width:60px;height:60px;">
        <img src="/assets/icons/unclicked/logout.svg" alt="" width="28" height="28" />
      </div>
      <div>
        <p class="fw-bold small text-uppercase text-green mb-1" style="letter-spacing:.08em;">Session Ended</p>
        <h1 class="h2 fw-bold mb-1" style="letter-spacing:-0.02em;">Signed Out Smoothly</h1>
        <p class="text-muted small mb-0">Your Buzz Fly account session has been closed on this device.</p>
      </div>
    </header>

    <section class="card border-0 shadow-lg rounded-4 p-3 p-md-4 w-100">
      <div class="text-center mb-3">
        <h2 class="h5 fw-bold mb-1">See you on your next journey</h2>
        <p class="text-muted small mb-0">
          Sign back in anytime to manage trips, saved stays, and your traveler profile.
        </p>
      </div>

      <div class="d-grid gap-2">
        <a href="/pages/auth/signin.html" class="btn green-btn w-100 d-flex align-items-center justify-content-center gap-2">
          Sign In Again
          <img src="/assets/icons/arrow-right.svg" alt="" width="16" height="16" style="filter:brightness(0) invert(1);" />
        </a>
        <a href="/index.html" class="btn bg-white border w-100 fw-semibold py-2">
          Return Home
        </a>
      </div>

      <div class="text-center pt-3 mt-3 border-top">
        <p class="small text-muted mb-0">
          Want a different account?
          <a href="/pages/auth/signup.html" class="text-purple text-decoration-none fw-semibold">Create a new one</a>
        </p>
      </div>
    </section>
  </main>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/main.js" defer></script>

  <!-- Defensive sign-out: if the user arrives here while still signed in
       (direct URL, browser back-button after a failed click handler, etc.)
       finish the job. Also clears the cached avatar so the next sign-in
       paints clean. -->
  <script type="module">
    import { signOut } from "/js/firebase/auth.js";
    import { auth } from "/js/firebase/firebase-init.js";
    import { userAvatarCache } from "/js/firebase/avatar-cache.js";

    await auth.authStateReady();
    if (auth.currentUser) {
      try { await signOut(); } catch (err) { console.warn("[logout] signOut failed:", err); }
    }
    userAvatarCache.clear();
  </script>
</body>
</html>
