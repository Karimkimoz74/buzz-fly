<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzz Fly - Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/main.min.css" />
</head>
<body class="auth-body">

  <!--   MINIMAL TOP BAR (brand + sign up link)   -->
  <header class="d-flex justify-content-between align-items-center px-4 py-3">
    <a href="/index.html" class="text-decoration-none fw-bold fs-5 text-green">Buzz Fly</a>
  </header>

  <main class="container d-flex flex-column align-items-center pb-5" style="max-width: 520px;">

    <!--   BRAND HEADER   -->
    <header class="d-flex flex-column align-items-center text-center gap-2 mb-4">
      <div class="bg-white rounded-circle shadow d-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
        <img src="/assets/icons/plane-takeoff.svg" alt="" style="width: 32px; height: 32px;" />
      </div>
      <h1 class="display-5 fw-bold mb-0" style="letter-spacing: -0.02em;">Buzz Fly</h1>
      <p class="text-muted mb-0">Your journey begins here.</p>
    </header>

    <!--   SIGN-IN CARD   -->
    <section class="card border-0 shadow-lg rounded-4 p-4 w-100">
      <form id="signinForm" novalidate>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label small fw-bold text-uppercase text-muted mb-1" style="letter-spacing: .08em; font-size: .6875rem;">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0">
              <img src="/assets/icons/email.svg" alt="" style="width: 18px; height: 18px; opacity: .7;" />
            </span>
            <input type="email" id="email" name="email" class="form-control bg-light border-0" placeholder="kimoz@example.com" autocomplete="email" required />
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label small fw-bold text-uppercase text-muted mb-0" style="letter-spacing: .08em; font-size: .6875rem;">Password</label>
            <a href="/pages/auth/forgot-password.html" class="small text-purple text-decoration-none fw-semibold">Forgot Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-0">
              <img src="/assets/icons/lock.svg" alt="" style="width: 18px; height: 18px; opacity: .7;" />
            </span>
            <input type="password" id="password" name="password" class="form-control bg-light border-0" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="input-group-text bg-light border-0" aria-label="Show password" data-toggle-password>
              <img src="/assets/icons/pass-show.svg" alt="" style="width: 18px; height: 18px; opacity: .7;" />
            </button>
          </div>
        </div>

        <!-- Sign In button -->
        <button type="submit" class="btn green-btn w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
          Sign In
          <img src="/assets/icons/arrow-right.svg" alt="" style="width: 18px; height: 18px; filter: brightness(0) invert(1);" />
        </button>

        <!-- Divider -->
        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1 m-0" />
          <span class="mx-3 small text-uppercase text-muted" style="letter-spacing: .08em;">Or continue with</span>
          <hr class="flex-grow-1 m-0" />
        </div>

        <!-- Social buttons -->
        <div class="d-flex flex-column gap-2 mb-3">
          <button type="button" class="btn d-flex align-items-center justify-content-center gap-2 w-100 bg-white border fw-semibold" data-auth-provider="google">
            <img src="/assets/icons/google.svg" alt="" style="width: 20px; height: 20px;" />
            Sign in with Google
          </button>
          <button type="button" class="btn d-flex align-items-center justify-content-center gap-2 w-100 bg-white border fw-semibold" data-auth-provider="apple">
            <img src="/assets/icons/apple.svg" alt="" style="width: 20px; height: 20px;" />
            Sign in with Apple
          </button>
        </div>

        <!-- Create account -->
        <div class="text-center pt-3 border-top small text-muted">
          Don't have an account?
          <a href="/pages/auth/signup.html" class="text-green text-decoration-none fw-semibold">Create Account</a>
        </div>

      </form>
    </section>

  </main>

  <!--   FOOTER   -->
  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/pages/auth.js" defer></script>
</body>
</html>
