<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzz Fly - Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages/auth.css" />
</head>
<body class="auth-body">

  <!--   MINIMAL TOP BAR (brand + sign up link)   -->
  <header class="auth-topbar">
    <a href="/index.html" class="auth-topbar__brand">Buzz Fly</a>
  </header>

  <main class="auth-page">

    <!--   BRAND HEADER   -->
    <header class="auth-header">
      <div class="auth-logo">
        <img src="/assets/icons/plane-takeoff.svg" alt="" />
      </div>
      <h1 class="auth-title">Buzz Fly</h1>
      <p class="auth-subtitle">Your journey begins here.</p>
    </header>

    <!--   SIGN-IN CARD   -->
    <section class="auth-card">
      <form class="auth-form" id="signinForm" novalidate>

        <!-- email -->
        <div class="auth-field">
          <label for="email" class="auth-label">Email Address</label>
          <div class="auth-input">
            <img src="/assets/icons/email.svg" alt="" class="auth-input__icon" />
            <input
              type="email"
              id="email"
              name="email"
              class="auth-input__control"
              placeholder="kimoz@example.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <!-- password -->
        <div class="auth-field">
          <div class="auth-field__head">
            <label for="password" class="auth-label">Password</label>
            <a href="/pages/auth/forgot-password.html" class="auth-link auth-link--purple">
              Forgot Password?
            </a>
          </div>
          <div class="auth-input">
            <img src="/assets/icons/lock.svg" alt="" class="auth-input__icon" />
            <input
              type="password"
              id="password"
              name="password"
              class="auth-input__control"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="auth-input__toggle"
              aria-label="Show password"
              data-toggle-password
            >
              <img src="/assets/icons/pass-show.svg" alt="" />
            </button>
          </div>
        </div>

        <!-- primary submit -->
        <button type="submit" class="auth-btn auth-btn--primary">
          Sign In
          <img src="/assets/icons/arrow-right.svg" alt="" />
        </button>

        <!-- OR divider -->
        <div class="auth-divider">
          <span>Or continue with</span>
        </div>

        <!-- social sign-in -->
        <div class="auth-social">
          <button type="button" class="auth-btn auth-btn--social" data-auth-provider="google">
            <img src="/assets/icons/google.svg" alt="" />
            Sign in with Google
          </button>
          <button type="button" class="auth-btn auth-btn--social" data-auth-provider="apple">
            <img src="/assets/icons/apple.svg" alt="" />
            Sign in with Apple
          </button>
        </div>

        <!-- create account -->
        <div class="auth-foot">
          <p>
            Don't have an account?
            <a href="/pages/auth/signup.html" class="auth-link">Create Account</a>
          </p>
        </div>

      </form>
    </section>

  </main>

  <!--   FOOTER   -->
  <div id="footer-slot"></div>

  <script src="/js/main.js" defer></script>
  <script src="/js/pages/auth.js" defer></script>
</body>
</html>
