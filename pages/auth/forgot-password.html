<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Perf: warm the TLS handshake to Firebase + Bootstrap origins during
       HTML parse, and start downloading the Firebase SDK in parallel so
       page scripts don't block waiting for the SDK to arrive. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://images.unsplash.com">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js" crossorigin>
  <title>Buzz Fly - Forgot Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/main.min.css" />
</head>
<body class="auth-body">

  <!--   MINIMAL TOP BAR (brand only)   -->
  <header class="d-flex justify-content-between align-items-center px-4 py-3">
    <a href="/index.html" class="text-decoration-none fw-bold fs-5 text-green">Buzz Fly</a>
  </header>

  <main class="container d-flex flex-column align-items-center pb-5" style="max-width: 520px;">

    <!--   BRAND HEADER   -->
    <header class="d-flex flex-column align-items-center text-center gap-2 mb-4">
      <div class="bg-white rounded-circle shadow d-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
        <img src="/assets/icons/plane-takeoff.svg" alt="" style="width: 32px; height: 32px;" />
      </div>
      <h1 class="display-5 fw-bold mb-0" style="letter-spacing: -0.02em;">Buzz Fly</h1>
      <p class="text-muted mb-0">Forgot Password</p>
    </header>

    <!--   RESET CARD   -->
    <section class="card border-0 shadow-lg rounded-4 p-4 w-100">
      <form id="forgotForm" novalidate>

        <!-- Card title (left-aligned) -->
        <div class="mb-4">
          <h2 class="fw-bold mb-2 fs-4">Reset your journey</h2>
          <p class="text-muted mb-0 small">
            Enter your email address and we'll send you a link to reset your password and get you back in the air.
          </p>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label small fw-bold text-uppercase text-muted mb-1" style="letter-spacing: .08em; font-size: .6875rem;">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0">
              <img src="/assets/icons/email.svg" alt="" style="width: 18px; height: 18px; opacity: .7;" />
            </span>
            <input type="email" id="email" name="email" class="form-control bg-light border-0" placeholder="traveler@example.com" autocomplete="email" required />
          </div>
        </div>

        <!-- Reset Password button -->
        <button type="submit" class="btn green-btn w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
          Reset Password
          <img src="/assets/icons/arrow-right.svg" alt="" style="width: 18px; height: 18px; filter: brightness(0) invert(1);" />
        </button>

        <!-- Back to login -->
        <a href="/pages/auth/signin.html" class="d-flex align-items-center justify-content-center gap-2 text-muted text-decoration-none small fw-medium">
          <span aria-hidden="true">&larr;</span>
          Back to login
        </a>

      </form>
    </section>

    <!--   Microcopy under the card   -->
    <p class="mt-4 mb-0 small text-uppercase text-center text-secondary" style="letter-spacing: .08em;">
      &copy; 2026 Buzz Fly Travel. Secure Concierge Access.
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script type="module" src="/js/pages/auth.js"></script>
</body>
</html>
