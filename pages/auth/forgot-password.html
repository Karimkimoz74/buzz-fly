<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzz Fly - Forgot Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages/auth.css" />
</head>
<body class="auth-body">

  <!--   MINIMAL TOP BAR (brand only)   -->
  <header class="auth-topbar">
    <a href="/index.html" class="auth-topbar__brand">Buzz Fly</a>
  </header>

  <main class="auth-page">

    <!--   BRAND HEADER   -->
    <header class="auth-header">
      <div class="auth-logo">
        <img src="/assets/icons/plane-takeoff.svg" alt="" />
      </div>
      <h1 class="auth-title">Buzz Fly</h1>
      <p class="auth-subtitle">Forgot Password</p>
    </header>

    <!--   RESET CARD   -->
    <section class="auth-card">
      <form class="auth-form" id="forgotForm" novalidate>

        <!-- card title (left-aligned) -->
        <div class="auth-card__head auth-card__head--start">
          <h2 class="auth-card__title auth-card__title--sm">Reset your journey</h2>
          <p class="auth-card__subtitle">
            Enter your email address and we'll send you a link to reset your password and get you back in the air.
          </p>
        </div>

        <!-- email -->
        <div class="auth-field">
          <label for="email" class="auth-label">Email Address</label>
          <div class="auth-input">
            <img src="/assets/icons/email.svg" alt="" class="auth-input__icon" />
            <input
              type="email"
              id="email"
              name="email"
              class="auth-input__control"
              placeholder="traveler@example.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <!-- primary submit -->
        <button type="submit" class="auth-btn auth-btn--primary">
          Reset Password
          <img src="/assets/icons/arrow-right.svg" alt="" />
        </button>

        <!-- back to login -->
        <a href="/pages/auth/signin.html" class="auth-back">
          <span aria-hidden="true">&larr;</span>
          Back to login
        </a>

      </form>
    </section>

    <!--   Small microcopy under the card   -->
    <p class="auth-microcopy">&copy; 2026 Buzz Fly Travel. Secure Concierge Access.</p>

  </main>

  <script src="/js/main.js" defer></script>
  <script src="/js/pages/auth.js" defer></script>
</body>
</html>
