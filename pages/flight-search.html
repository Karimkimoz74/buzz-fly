<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Perf: warm the TLS handshake to Firebase + Bootstrap origins during
       HTML parse, and start downloading the Firebase SDK in parallel so
       page scripts don't block waiting for the SDK to arrive. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js" crossorigin>

  <title>Flight Results — Buzz Fly</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.min.css" />
  <script>/* edited by rawan - apply stored theme before first paint */
    (function(){var t=localStorage.getItem("buzzfly.theme");if(t)document.documentElement.setAttribute("data-bs-theme",t);})();
  </script>
</head>
<body>

  <div id="navbar-slot"></div>

  <main class="container-xl py-4">

    <!-- Header: leg indicator + route + back link -->
    <div class="d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-2 mb-4">
      <div>
        <p class="text-uppercase fw-bold mb-1" style="font-size:.65rem;color:#a1a1aa;letter-spacing:.1em;" data-leg-eyebrow>OUTBOUND</p>
        <h1 class="mb-1" data-route-title>—</h1>
        <p class="text-secondary mb-0" data-route-sub>—</p>
      </div>
      <a href="/index.html" class="text-decoration-none fw-semibold text-green" data-back-link>← Back to search</a>
    </div>

    <!-- Inline messages live here -->
    <div id="flight-results-msg" class="mb-3"></div>

    <!-- Filter chips (one active at a time) -->
    <div class="d-flex flex-wrap gap-2 mb-3" data-chips>
      <button type="button" class="btn btn-sm rounded-pill green-btn px-3" data-chip="best" aria-pressed="true">Best Value</button>
      <button type="button" class="btn btn-sm rounded-pill btn-light px-3" data-chip="fastest" aria-pressed="false">Fastest</button>
      <button type="button" class="btn btn-sm rounded-pill btn-light px-3" data-chip="cheapest" aria-pressed="false">Cheapest</button>
    </div>

    <!-- Results -->
    <div id="flight-results"></div>

    <!-- Discover more -->
    <div class="text-center py-3 d-none" data-discover-wrap>
      <button type="button" class="btn btn-outline-secondary rounded-pill px-5" data-discover-btn>
        Discover more flights
      </button>
    </div>

  </main>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script type="module" src="/js/pages/flight-search.js"></script>
</body>
</html>
