<!-- ==============  NAVBAR (Bootstrap)  ==============
     Shared across every page. Injected by js/main.js → loadPartials().
     Built on Bootstrap 5 navbar + dropdown. Reuses utilities from main.scss
     (.text-green, .bg-light-green, .green-btn). Active link is set
     dynamically by main.js → highlightActiveNavLink().

     Layout note: actions (bell + user) sit OUTSIDE .navbar-collapse so they
     stay visible on narrow screens. Order utilities flip them to the right
     side on desktop (Brand → Links → Actions).
     ============================================ -->
<header class="navbar navbar-expand-lg fixed-top bg-white shadow-sm">
  <div class="container-fluid">

    <a href="/index.html" class="navbar-brand fw-bold text-green">Buzz Fly</a>

    <!--   ACTIONS (notifications + account) — always visible, even on mobile   -->
    <div class="d-flex align-items-center gap-1 order-lg-3 ms-auto ms-lg-0">

      <!-- =====  NOTIFICATIONS DROPDOWN — signed-in users only  ===== -->
      <div class="dropdown d-none" data-auth-only="signed-in">
        <button type="button" class="buzz-icon-btn" aria-label="Notifications" data-bs-toggle="dropdown" aria-expanded="false">
          <img src="/assets/icons/bell.svg" alt="" />
        </button>

        <div class="dropdown-menu dropdown-menu-end p-0 buzz-notif-menu" data-notif-menu>
          <div class="px-4 py-3 border-bottom d-flex align-items-center justify-content-between gap-2">
            <h6 class="m-0 fw-bold">Notifications</h6>
            <span class="badge rounded-pill bg-light-green text-green fw-semibold d-none" style="font-size:.65rem;" data-notif-unread-pill></span>
          </div>

          <!-- Populated by navbar-auth.js from notifications/{*} -->
          <div data-notif-list>
            <div class="px-4 py-4 text-center">
              <p class="text-muted small mb-0">Loading…</p>
            </div>
          </div>

          <!-- Footer link — always visible, even when there are no rows. -->
          <a href="/pages/Notifications.html" class="d-block text-center py-3 text-decoration-none fw-semibold text-green border-top">
            View all notifications
          </a>
        </div>
      </div>
      <!-- =====  /NOTIFICATIONS DROPDOWN  ===== -->

      <!-- =====  ACCOUNT DROPDOWN  ===== -->
      <div class="dropdown">
        <button type="button" class="buzz-icon-btn" aria-label="Account" data-bs-toggle="dropdown" aria-expanded="false">
          <img src="/assets/icons/user.svg" alt="" data-auth-avatar data-auth-avatar-fill data-default-src="/assets/icons/user.svg" />
        </button>

        <div class="dropdown-menu dropdown-menu-end p-0">

          <!-- Signed-out variant -->
          <div data-auth-only="signed-out">
            <div class="px-4 py-3 border-bottom" style="min-width: 240px;">
              <p class="m-0 fw-bold">Welcome to Buzz Fly!</p>
              <p class="m-0 text-muted small">Sign in to unlock your trips</p>
            </div>
            <div class="p-2 d-grid gap-2">
              <a href="/pages/auth/signin.html" class="btn green-btn w-100">Sign In / Sign Up</a>
            </div>
          </div>

          <!-- Signed-in variant (hidden by default) -->
          <div class="d-none" data-auth-only="signed-in">
            <div class="px-4 py-3 border-bottom" style="min-width: 240px;">
              <p class="m-0 fw-bold" data-auth-display-name>Welcome back!</p>
              <p class="m-0 text-muted small text-truncate" data-auth-email></p>
            </div>
            <div class="p-2 d-grid gap-2">
              <a href="/pages/profile/profile.html" class="btn green-btn w-100">Settings</a>
              <button type="button" class="btn light-purple-btn w-100" data-auth-signout>Sign Out</button>
            </div>
          </div>

        </div>
      </div>
      <!-- =====  /ACCOUNT DROPDOWN  ===== -->

    </div>

    <!--   MOBILE TOGGLER (only shows below lg breakpoint)   -->
    <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#buzzNavContent" aria-controls="buzzNavContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!--   COLLAPSING NAV LINKS   -->
    <div class="collapse navbar-collapse order-lg-2" id="buzzNavContent">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link buzz-nav-link" href="/index.html">Explore</a></li>
        <li class="nav-item"><a class="nav-link buzz-nav-link" href="/pages/Help-center.html">Support</a></li>
        <li class="nav-item"><a class="nav-link buzz-nav-link" href="/pages/contact.html">Contact Us</a></li>
      </ul>
    </div>

  </div>
</header>
